server:
  port: 4001

spring:
  application:
    name: identity-service
  data:
    mongodb:
      uri: mongodb+srv://${MONGODB_ATLAS_USER}:${MONGODB_ATLAS_PASSWORD}@${MONGODB_ATLAS_HOST}/${MONGODB_DATABASE:identity-db}?retryWrites=true&w=majority&appName=Cluster0
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET}

identity:
  jwt:
    diner-token-days: ${DINER_TOKEN_DAYS:60}
    partner-token-days: ${PARTNER_TOKEN_DAYS:14}
  sms:
    log-otp-for-dev: ${LOG_OTP_FOR_DEV:false}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

facebook:
  app-id: ${FACEBOOK_APP_ID:}
  app-secret: ${FACEBOOK_APP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
