server:
  port: 4005

spring:
  application:
    name: engagement-service
  data:
    mongodb:
      uri: mongodb+srv://${MONGODB_ATLAS_USER}:${MONGODB_ATLAS_PASSWORD}@${MONGODB_ATLAS_HOST}/${MONGODB_DATABASE:engagement-db}?retryWrites=true&w=majority&appName=Cluster0

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
